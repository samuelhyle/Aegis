[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agentic-clinical-intelligence"
version = "0.3.0"
description = "Production-grade agentic AI environment for clinical data investigation"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AEGIS Team"}
]
keywords = ["clinical", "ai", "agentic", "healthcare", "investigation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pandas>=2.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

llm = [
    "openai>=1.30",
]

vector = [
    "sentence-transformers>=3.0",
]

all = [
    "aegis-agentic-clinical-intelligence[dev,llm,vector]",
]

[project.scripts]
aegis-ingest = "aegis.ingest:main"
aegis-db = "aegis.cli:db"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "UP017"]

[tool.ruff.lint.isort]
known-first-party = ["aegis"]
