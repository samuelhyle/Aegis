name: AEGIS CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Run linter
        run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/test_investigation.py -q

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate benchmark
        run: |
          python -c "
          import json
          with open('benchmark.jsonl') as f:
              records = [json.loads(line) for line in f if line.strip()]
          print(f'Benchmark questions: {len(records)}')
          assert len(records) >= 50, f'Expected 50+ questions, got {len(records)}'
          print('Benchmark validation passed')
          "

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aegis:latest .

      - name: Test Docker image
        run: |
          docker run -d --name aegis-test -p 8000:8000 aegis:latest
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop aegis-test